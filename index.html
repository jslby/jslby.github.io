<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Резюме</title>
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #334155;
      --line-color: #f1f5f9;
      
      /* Нежно-голубой акцент */
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --accent-light: #f0f9ff;
      --accent-border: #bae6fd;
      
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--bg-card);
      padding: 56px;
    }

    /* Шапка */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 28px;
      margin-bottom: 36px;
      border-bottom: 3px solid var(--accent-light);
    }

    .header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 1.15rem;
      color: var(--accent-dark);
      font-weight: 600;
    }

    .print-btn {
      background: var(--text-main);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: var(--transition);
      border-left: 3px solid var(--accent);
    }

    .print-btn:hover {
      background: var(--accent-dark);
      color: #ffffff;
    }

    /* Макет */
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
    }

    .section { margin-bottom: 40px; }

    .section h2 {
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-main);
      padding-bottom: 8px;
      margin-bottom: 20px;
      font-weight: 800;
      border-bottom: 1px solid var(--line-color);
    }

    .section h3 {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 8px;
      font-weight: 700;
    }

    /* Списки и контакты */
    .contact-list, .lang-list { list-style: none; font-size: 0.95rem; }
    .contact-list li, .lang-list li { margin-bottom: 12px; color: var(--text-main); }
    .contact-list a {
      color: var(--accent-dark);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }
    .contact-list a:hover {
      color: var(--text-main);
      border-bottom: 1px solid var(--text-main);
    }

    /* Теги и фильтры */
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .tag {
      background: var(--line-color);
      color: var(--text-main);
      padding: 4px 10px;
      font-size: 0.82rem;
      font-weight: 500;
      border: none;
      transition: var(--transition);
    }
    .tag.highlight {
      background: var(--accent-light);
      color: var(--accent-dark);
      font-weight: 600;
      border-left: 3px solid var(--accent);
    }
    .tag.clickable {
      cursor: pointer;
      user-select: none;
      background: #ffffff;
      border: 1px solid var(--line-color);
    }
    .tag.clickable:hover {
      border-color: var(--accent-dark);
      color: var(--accent-dark);
    }
    .tag.clickable.active {
      background: var(--accent-dark);
      color: #ffffff;
      border-color: var(--accent-dark);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filter-label {
      font-size: 0.88rem;
      color: var(--text-sub);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Чистые карточки с акцентным левым бордером */
    .case-post {
      padding: 20px 24px;
      margin-bottom: 28px;
      background: var(--bg-card);
      border-left: 3px solid var(--accent-border);
      transition: var(--transition);
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .case-post:hover {
      border-left-color: var(--accent-dark);
      transform: translateX(4px);
    }

    .case-meta {
      font-size: 0.85rem;
      color: var(--accent-dark);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .case-title {
      font-size: 1.18rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-main);
    }

    /* Метрики */
    .case-metrics {
      display: flex;
      gap: 24px;
      background: var(--accent-light);
      padding: 14px 20px;
      margin: 16px 0;
      flex-wrap: wrap;
      border-left: 3px solid var(--accent);
    }

    .metric-item { display: flex; flex-direction: column; }
    .metric-value {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--accent-dark);
    }
    .metric-label {
      font-size: 0.72rem;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .case-summary { color: var(--text-sub); font-size: 0.98rem; }
    .case-body {
      font-size: 0.95rem;
      color: var(--text-main);
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line-color);
      display: none;
    }
    .case-body.open { display: block; }

    .read-more-btn {
      background: none;
      border: none;
      color: var(--accent-dark);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      margin-top: 12px;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .read-more-btn:hover { color: var(--text-main); }

    /* Опыт работы */
    .job-card {
      padding: 16px 20px;
      margin-bottom: 24px;
      border-left: 3px solid var(--line-color);
      transition: var(--transition);
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .job-card:hover {
      border-left-color: var(--accent);
      transform: translateX(4px);
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .job-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    .job-title .company { color: var(--accent-dark); font-weight: 600; }
    .job-period { font-size: 0.88rem; color: var(--text-sub); font-weight: 600; white-space: nowrap; }
    .job-desc { padding-left: 18px; font-size: 0.96rem; color: var(--text-main); }
    .job-desc li { margin-bottom: 6px; }

    .summary-text { font-size: 1rem; color: var(--text-main); line-height: 1.65; }

    .edu-item { margin-bottom: 14px; font-size: 0.95rem; }
    .edu-year { color: var(--text-sub); font-size: 0.88rem; font-weight: 500; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; gap: 24px; }
      .page { padding: 24px; }
      .case-metrics { gap: 14px; }
    }

    /* Печать / PDF */
    @media print {
      body { background: #ffffff; padding: 0; color: #000000; }
      .page { padding: 0; max-width: 100%; }
      .print-btn, .filter-bar, .read-more-btn { display: none !important; }
      .layout { grid-template-columns: 240px 1fr; gap: 24px; }
      .case-post, .job-card { transform: none !important; border-left-color: #000000 !important; }
      .case-body { display: block !important; }
      .case-metrics { background: #f8fafc; border-left-color: #000000 !important; }
      .metric-value, .subtitle, .contact-list a, .job-title .company { color: #000000 !important; }
      a { text-decoration: none; color: #000000; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div>
        <h1 id="name"></h1>
        <p class="subtitle" id="title"></p>
      </div>
      <button onclick="window.print()" class="print-btn">Печать / PDF</button>
    </header>

    <div class="layout">
      <aside>
        <section class="section">
          <h2>Контакты</h2>
          <ul class="contact-list" id="contacts"></ul>
        </section>

        <section class="section">
          <h2>Навыки</h2>
          <div id="skills"></div>
        </section>

        <section class="section">
          <h2>Образование</h2>
          <div id="education"></div>
        </section>

        <section class="section">
          <h2>Языки</h2>
          <ul class="lang-list" id="languages"></ul>
        </section>
      </aside>

      <main>
        <section class="section">
          <h2>О себе</h2>
          <p class="summary-text" id="summary"></p>
        </section>

        <section class="section">
          <h2>Блог кейсов / Case Feed</h2>
          <div class="filter-bar" id="case-filters"></div>
          <div id="cases-feed"></div>
        </section>

        <section class="section">
          <h2>Опыт работы</h2>
          <div id="experience"></div>
        </section>
      </main>
    </div>
  </div>

  <script>
    let globalCases = [];

    fetch('resume.json')
      .then(res => res.json())
      .then(data => {
        document.title = `${data.personal.name} — ${data.personal.title}`;
        document.getElementById('name').textContent = data.personal.name;
        document.getElementById('title').textContent = data.personal.title;
        document.getElementById('summary').textContent = data.personal.summary;

        // Контакты
        document.getElementById('contacts').innerHTML = `
          <li><strong>Email:</strong> <a href="mailto:${data.personal.email}">${data.personal.email}</a></li>
          <li><strong>Тел:</strong> <a href="tel:${data.personal.phone}">${data.personal.phone}</a></li>
          <li><strong>Локация:</strong> ${data.personal.location}</li>
        `;

        // Навыки
        const renderTags = (items, isHighlight = false) => 
          `<div class="tags">${items.map(i => `<span class="tag ${isHighlight ? 'highlight' : ''}">${i}</span>`).join('')}</div>`;

        document.getElementById('skills').innerHTML = `
          <h3>Источники</h3>${renderTags(data.skills.traffic)}
          <h3>Вертикали & ГЕО</h3>${renderTags([...data.skills.verticals, ...data.skills.geo])}
          <h3>Tech & Analytics</h3>${renderTags(data.skills.tech, true)}
        `;

        // Отрисовка Кейсов
        globalCases = data.cases || [];
        initCaseFilters(globalCases);
        renderCases(globalCases);

        // Опыт работы
        document.getElementById('experience').innerHTML = data.experience.map(job => `
          <article class="job-card">
            <div class="job-header">
              <h3 class="job-title">${job.position} <span class="company">@ ${job.company}</span></h3>
              <span class="job-period">${job.period}</span>
            </div>
            <ul class="job-desc">
              ${job.description.map(item => `<li>${item}</li>`).join('')}
            </ul>
          </article>
        `).join('');

        // Образование
        document.getElementById('education').innerHTML = data.education.map(edu => `
          <div class="edu-item">
            <p><strong>${edu.institution}</strong></p>
            <p>${edu.degree}</p>
            <p class="edu-year">${edu.year}</p>
          </div>
        `).join('');

        // Языки
        document.getElementById('languages').innerHTML = data.languages.map(lang => `
          <li><strong>${lang.name}:</strong> ${lang.level}</li>
        `).join('');
      });

    // Фильтры для кейсов
    function initCaseFilters(cases) {
      const allTags = Array.from(new Set(cases.flatMap(c => c.tags)));
      const filterContainer = document.getElementById('case-filters');
      
      filterContainer.innerHTML = `
        <span class="filter-label">Фильтр:</span>
        <button class="tag clickable active" onclick="filterCases('all', this)">Все</button>
        ${allTags.map(tag => `<button class="tag clickable" onclick="filterCases('${tag}', this)">${tag}</button>`).join('')}
      `;
    }

    function filterCases(tag, btn) {
      document.querySelectorAll('#case-filters .tag').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const filtered = tag === 'all' 
        ? globalCases 
        : globalCases.filter(c => c.tags.includes(tag));
        
      renderCases(filtered);
    }

    function renderCases(cases) {
      const container = document.getElementById('cases-feed');
      if (!cases.length) {
        container.innerHTML = '<p class="case-meta">Кейсы не найдены.</p>';
        return;
      }

      container.innerHTML = cases.map(c => `
        <article class="case-post">
          <div class="case-header">
            <div class="case-meta">${c.date}</div>
            <h3 class="case-title">${c.title}</h3>
            <div class="tags" style="margin-top: 8px;">
              ${c.tags.map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
          </div>

          <div class="case-metrics">
            ${c.metrics.map(m => `
              <div class="metric-item">
                <span class="metric-value">${m.value}</span>
                <span class="metric-label">${m.label}</span>
              </div>
            `).join('')}
          </div>

          <p class="case-summary">${c.summary}</p>
          <div class="case-body" id="body-${c.id}">${c.content}</div>
          <button class="read-more-btn" onclick="toggleCase('${c.id}', this)">Читать разбор ↓</button>
        </article>
      `).join('');
    }

    function toggleCase(id, btn) {
      const body = document.getElementById(`body-${id}`);
      const isOpen = body.classList.toggle('open');
      btn.textContent = isOpen ? 'Свернуть ↑' : 'Читать разбор ↓';
    }
  </script>
</body>
</html>

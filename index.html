<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Резюме</title>
  <style>
    :root {
      --bg-color: #fcfcfc;
      --text-main: #222222;
      --text-muted: #666666;
      --border-color: #e5e5e5;
      --accent: #111111;
      --tag-bg: #f0f0f0;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding: 40px 20px;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      background: #ffffff;
      padding: 40px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    .header h1 { font-size: 2.2rem; letter-spacing: -0.5px; }
    .subtitle { font-size: 1.1rem; color: var(--text-muted); font-weight: 500; }

    .print-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
    }

    .section { margin-bottom: 28px; }

    .section h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      margin-bottom: 14px;
    }

    .section h3 { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 6px; }

    .contact-list, .lang-list { list-style: none; font-size: 0.95rem; }
    .contact-list li, .lang-list li { margin-bottom: 6px; }
    .contact-list a { color: var(--text-main); text-decoration: none; }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag { background: var(--tag-bg); padding: 3px 8px; border-radius: 4px; font-size: 0.82rem; }
    .tag.highlight { background: #e8e8e8; font-weight: 600; }

    .edu-item { margin-bottom: 10px; font-size: 0.9rem; }
    .edu-year { color: var(--text-muted); font-size: 0.85rem; }

    .job-card { margin-bottom: 24px; page-break-inside: avoid; break-inside: avoid; }
    .job-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .job-title { font-size: 1.05rem; }
    .job-title .company { color: var(--text-muted); font-weight: normal; }
    .job-period { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
    .job-desc { padding-left: 18px; font-size: 0.95rem; }
    .job-desc li { margin-bottom: 4px; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .page { padding: 20px; }
    }

    /* Стили для печати */
    @media print {
      body { background: #fff; padding: 0; color: #000; }
      .page { border: none; padding: 0; max-width: 100%; }
      .print-btn { display: none; }
      .layout { grid-template-columns: 240px 1fr; gap: 20px; }
      .tag { border: 1px solid #ccc; background: none; }
      a { text-decoration: none; color: #000; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div>
        <h1 id="name"></h1>
        <p class="subtitle" id="title"></p>
      </div>
      <button onclick="window.print()" class="print-btn">Печать / PDF</button>
    </header>

    <div class="layout">
      <aside>
        <section class="section">
          <h2>Контакты</h2>
          <ul class="contact-list" id="contacts"></ul>
        </section>

        <section class="section">
          <h2>Навыки</h2>
          <div id="skills"></div>
        </section>

        <section class="section">
          <h2>Образование</h2>
          <div id="education"></div>
        </section>

        <section class="section">
          <h2>Языки</h2>
          <ul class="lang-list" id="languages"></ul>
        </section>
      </aside>

      <main>
        <section class="section">
          <h2>О себе</h2>
          <p id="summary"></p>
        </section>

        <section class="section">
          <h2>Опыт работы</h2>
          <div id="experience"></div>
        </section>
      </main>
    </div>
  </div>

  <script>
    fetch('resume.json')
      .then(res => res.json())
      .then(data => {
        document.title = `${data.personal.name} — ${data.personal.title}`;
        document.getElementById('name').textContent = data.personal.name;
        document.getElementById('title').textContent = data.personal.title;
        document.getElementById('summary').textContent = data.personal.summary;

        // Контакты
        document.getElementById('contacts').innerHTML = `
          <li><strong>Email:</strong> <a href="mailto:${data.personal.email}">${data.personal.email}</a></li>
          <li><strong>Тел:</strong> <a href="tel:${data.personal.phone}">${data.personal.phone}</a></li>
          <li><strong>Локация:</strong> ${data.personal.location}</li>
        `;

        // Навыки
        const renderTags = (items, isHighlight = false) => 
          `<div class="tags">${items.map(i => `<span class="tag ${isHighlight ? 'highlight' : ''}">${i}</span>`).join('')}</div>`;

        document.getElementById('skills').innerHTML = `
          <h3>Источники</h3>${renderTags(data.skills.traffic)}
          <h3>Вертикали & ГЕО</h3>${renderTags([...data.skills.verticals, ...data.skills.geo])}
          <h3>Tech & Analytics</h3>${renderTags(data.skills.tech, true)}
        `;

        // Опыт работы
        document.getElementById('experience').innerHTML = data.experience.map(job => `
          <article class="job-card">
            <div class="job-header">
              <h3 class="job-title">${job.position} <span class="company">@ ${job.company}</span></h3>
              <span class="job-period">${job.period}</span>
            </div>
            <ul class="job-desc">
              ${job.description.map(item => `<li>${item}</li>`).join('')}
            </ul>
          </article>
        `).join('');

        // Образование
        document.getElementById('education').innerHTML = data.education.map(edu => `
          <div class="edu-item">
            <p><strong>${edu.institution}</strong></p>
            <p>${edu.degree}</p>
            <p class="edu-year">${edu.year}</p>
          </div>
        `).join('');

        // Языки
        document.getElementById('languages').innerHTML = data.languages.map(lang => `
          <li><strong>${lang.name}:</strong> ${lang.level}</li>
        `).join('');
      });
  </script>
</body>
</html>
